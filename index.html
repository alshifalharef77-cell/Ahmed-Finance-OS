<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0B" />
    <meta name="description" content="Ahmed Finance OS — personal finance terminal" />
    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <title>Ahmed Finance OS — Alpha 0.2.7</title>
  </head>
  <body>
    <main class="terminal" aria-label="Ahmed Finance OS terminal">
      <header class="terminal-header"><span>AHMED FINANCE OS / ALPHA 0.2.7</span><span id="connectionStatus">LOCAL / READY</span></header>
      <section id="terminalOutput" class="terminal-output" aria-live="polite" aria-label="Terminal output"></section>
      <form id="commandForm" class="command-line" autocomplete="off">
        <label class="prompt" for="commandInput">ahmed@finance:~$</label>
        <input id="commandInput" autofocus spellcheck="false" autocapitalize="off" autocomplete="off" enterkeyhint="send" inputmode="text" aria-label="Command" placeholder="type help to see commands" />
      </form>
    </main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
